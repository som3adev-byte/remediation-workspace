packages:
  - apps/*
  - packages/*
# Only these packages may run install scripts (native argon2 binding, Prisma engines, esbuild).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
# Patched transitive versions (pnpm audit). postcss is build-time only inside next;
# deepmerge-ts is used by the Prisma CLI config loader. Neither sees user input.
overrides:
  postcss: '>=8.5.23'
  deepmerge-ts: '>=8.0.0'
